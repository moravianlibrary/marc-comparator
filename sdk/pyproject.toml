[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "marc-comparator-sdk"
version = "0.0.1"
authors = [
    {name = "Robert Randiak", email = "randiak@protonmail.com"}
]
requires-python = ">=3.12"
dynamic = ["dependencies", "description", "readme"]

[project.scripts]
marc-comparator = "marc_comparator.cli:main"

[tool.setuptools]
packages = [
    "marc_comparator",
    "marc_comparator.authority_linkers",
    "marc_comparator.comparators",
    "marc_comparator.comparators.intiim_engine",
    "marc_comparator.comparators.intiim_engine.checks",
    "marc_comparator.validators",
]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}
description = {file = "description.txt"}
readme = {file = "README.md"}
