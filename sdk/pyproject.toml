[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "marc-comparator-sdk"
version = "1.0.0-rc3"
authors = [
    {name = "Robert Randiak", email = "randiak@protonmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "aleph-nought @ git+https://github.com/moravianlibrary/aleph-nought.git@v0.2.14",
    "httpx",
    "kramerius @ git+https://github.com/moravianlibrary/kramerius-client.git@v0.3.3",
    "lxml",
    "marcdantic @ git+https://github.com/moravianlibrary/marcdantic.git@v0.3.13",
    "pydantic",
    "pymarc>=5",
    "python-stdnum",
    "rapidfuzz",
    "solrify @ git+https://github.com/moravianlibrary/solrify.git@v0.1.1",
    "typer",
]
dynamic = ["description", "readme"]

[project.optional-dependencies]
# Plugins that declare harvest tables need SQLAlchemy to describe them. The rest
# of the SDK — including the CLI, which runs against files — does not.
storage = ["sqlalchemy>=2"]

[project.scripts]
marc-comparator = "marc_comparator.cli:main"

[tool.setuptools]
packages = [
    "marc_comparator",
    "marc_comparator.cli",
    "marc_comparator.authority_linkers",
    "marc_comparator.comparators",
    "marc_comparator.comparators.intiim_engine",
    "marc_comparator.comparators.intiim_engine.checks",
    "marc_comparator.validators",
]

[tool.setuptools.dynamic]
description = {file = "description.txt"}
readme = {file = "README.md"}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Argument/Option in argument defaults is typer's documented API, not a
# mutable-default bug, so B008 does not apply to them.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
