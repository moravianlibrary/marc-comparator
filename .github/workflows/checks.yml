name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.13.1
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install locked dependencies
        run: |
          uv sync --directory app --all-extras --frozen
          cd client && bun install --frozen-lockfile
      - name: Check formatting, lint, types, lockfiles and chart
        run: make check

      # Secret and dependency scanning are gates, not advice: a leaked key or a
      # known-vulnerable dependency should fail here rather than ship. The
      # secret scan reads the working tree; auditing the whole git history is a
      # separate one-off, not something every pull request should pay for. The
      # scanners, their pins and the one documented exemption live in the
      # Makefile, so the same scan runs here and on a developer's machine.
      - name: Scan for secrets and known-vulnerable dependencies
        run: make audit

  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.13.1
      - name: Install locked dependencies
        run: uv sync --directory app --all-extras --frozen
      - name: Run app tests with disposable Postgres and Redis containers
        run: uv run --directory app pytest tests -q

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
