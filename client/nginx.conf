# Mirrored by deploy/helm/marc-comparator/templates/client-configmap.yaml,
# which is mounted over this file in the cluster. This copy serves a plain
# `podman run` of the image; that one serves every deployment. Change both.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1) Static files from Vite build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these, so the name changes whenever the bytes do and
    # the cache can be told to keep them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The translations do not get a fingerprint: /locales/cs/records.json is
    # the same URL for every build. Without a Cache-Control nginx sends none
    # at all, so the browser falls back to guessing from Last-Modified and
    # holds a copy for hours — which is how a deploy once shipped new code
    # against old strings and showed raw keys like `plots.sections.linking`
    # to everyone who had the page open that day. Revalidate every time; the
    # ETag keeps the usual answer a 304.
    location /locales/ {
        add_header Cache-Control "no-cache";
    }

    # Same reasoning: index.html names the hashed bundles, so a stale copy
    # pins the whole app to the previous build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 2) Proxy backend API requests
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
