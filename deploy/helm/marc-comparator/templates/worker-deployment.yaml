apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marc-comparator.fullname" . }}-worker
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "marc-comparator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "marc-comparator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "marc-comparator.image" (dict "image" .Values.worker.image "global" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.worker.profiling }}
          # py-spy samples by reading another process's memory, which the
          # default container capability set forbids — and the host's
          # kernel.yama.ptrace_scope=1 would forbid it too, for a process that
          # is not a descendant of the profiler. Debugging only.
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
          {{- end }}
          # Pin concurrency so the pool does not fork one process per node CPU
          # (~8) onto a 2-CPU/2Gi pod, which oversubscribes and triggers the
          # OOM/eviction that orphans tasks. See PLAN Workstream 1.
          command:
            - celery
            - -A
            - adapters.tasks
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
          envFrom:
            - configMapRef:
                name: {{ include "marc-comparator.fullname" . }}-config
            - secretRef:
                name: {{ include "marc-comparator.fullname" . }}-secret
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
