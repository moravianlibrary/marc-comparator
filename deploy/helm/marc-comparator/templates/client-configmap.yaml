apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marc-comparator.fullname" . }}-client-nginx
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
data:
  # This is mounted over /etc/nginx/conf.d/default.conf, so it REPLACES the
  # client/nginx.conf baked into the image rather than adding to it. The two
  # have to be kept in step: the image's copy is what `podman run` serves,
  # this one is what the cluster serves, and a rule added to only one of them
  # works in exactly the place nobody is testing.
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite fingerprints these, so the name changes whenever the bytes do
        # and the cache can be told to keep them forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The translations do not get a fingerprint: /locales/cs/records.json
        # is the same URL for every build. Without a Cache-Control nginx
        # sends none at all, so the browser guesses from Last-Modified and
        # holds a copy for hours — which is how a deploy shipped new code
        # against old strings and showed raw keys like `plots.sections.linking`
        # to anyone who had the page open that day. Revalidate every time;
        # the ETag keeps the usual answer a 304.
        location /locales/ {
            add_header Cache-Control "no-cache";
        }

        # Same reasoning: index.html names the hashed bundles, so a stale
        # copy pins the whole app to the previous build.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://{{ include "marc-comparator.fullname" . }}-app:{{ .Values.app.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
