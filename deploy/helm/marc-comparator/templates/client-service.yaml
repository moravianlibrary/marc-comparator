apiVersion: v1
kind: Service
metadata:
  name: {{ include "marc-comparator.fullname" . }}-client
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "marc-comparator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
