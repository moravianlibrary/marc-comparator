{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marc-comparator.fullname" . }}-ollama-entrypoint
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e

    # Start the server in background
    ollama serve &
    SERVER_PID=$!

    # Wait for the server to be ready
    for i in $(seq 10); do
      if ollama ps >/dev/null 2>&1; then
        break
      fi
      sleep 1
    done

    # Pull required models
    IFS=','
    for model in $MODELS; do
      ollama pull "$model"
    done

    # Keep the server running
    wait $SERVER_PID
{{- end }}
