apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}

  postgresql:
    parameters:
      {{- range $name, $value := .Values.cnpg.parameters }}
      {{ $name }}: {{ $value | quote }}
      {{- end }}
      {{- if .Values.cnpg.pgStatStatements }}
      # Setting any pg_stat_statements.* parameter makes CNPG manage the
      # extension: it preloads the library and creates the extension in
      # every database, which listing it in shared_preload_libraries alone
      # did not.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "top"
      {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
      secret:
        name: {{ include "marc-comparator.fullname" . }}-cnpg-auth

  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- if .Values.cnpg.storage.storageClassName }}
    storageClass: {{ .Values.cnpg.storage.storageClassName | quote }}
    {{- end }}

  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
