{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "marc-comparator.fullname" . }}-ollama
  labels:
    {{- include "marc-comparator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ include "marc-comparator.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "marc-comparator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "marc-comparator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.ollama.port }}
              protocol: TCP
          env:
            - name: OLLAMA_MODELS
              value: /models
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ollama.storage.storageClassName }}
        storageClassName: {{ .Values.ollama.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.storage.size }}
{{- end }}
