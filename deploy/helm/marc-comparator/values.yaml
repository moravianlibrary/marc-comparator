# -- Global image settings
image:
  registry: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- App (FastAPI)
app:
  replicaCount: 1
  image:
    repository: marc-comparator-app
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Worker (Celery)
worker:
  replicaCount: 1
  # Number of prefork worker processes. Keep at/under the CPU limit below to
  # avoid oversubscription (OOM/eviction that orphans tasks).
  concurrency: 2
  # -- Grant the worker CAP_SYS_PTRACE so py-spy can attach to the pool
  # processes. Debugging only — it lets anything in the container read any
  # other process's memory, and the worker runs as root. Toggling it replaces
  # the pod, so turn it on before starting the run you mean to profile, not
  # during one. `make PROFILE=1 helm-install` sets it.
  profiling: false
  # Per-call-site SQL accounting in the worker (adapters.sql_tracing). Its own
  # switch rather than part of `profiling`, because the stack capture it adds
  # to every query is exactly the kind of overhead that would skew a py-spy
  # sample taken at the same time.
  sqlTrace: false
  image:
    repository: marc-comparator-worker
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

# -- Beat (Celery Beat with redbeat scheduler)
beat:
  image:
    repository: marc-comparator-worker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Client (nginx + React SPA, proxies /api to app)
client:
  replicaCount: 1
  image:
    repository: marc-comparator-client
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Redis (StatefulSet)
redis:
  image:
    repository: redis
    tag: "7-alpine"
  port: 6379
  storage:
    size: 1Gi
    storageClassName: ""
  # -- Redis' own ceiling, which must stay clearly below the container limit:
  # an AOF rewrite forks, and the copy-on-write pages count against the same
  # cgroup. The MARC cache alone reached ~300 MB at 344k records, so 256Mi
  # was under the working set rather than over it.
  maxmemory: 512mb
  # -- See the configmap: only cache keys carry a TTL, so this never evicts
  # a queued task.
  maxmemoryPolicy: volatile-lru
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 250m
      memory: 1Gi

# -- PostgreSQL via CloudNativePG
cnpg:
  # Name of the CNPG Cluster resource to create
  name: marc-comparator-db
  instances: 1
  # -- Load pg_stat_statements, which accumulates per-statement call counts and
  # timings for as long as the server runs. It is how you find out which SQL a
  # long task actually spends its time in, costs a few percent, and is the
  # standard Postgres answer to that question. Changing this restarts the
  # instance, because shared_preload_libraries is only read at startup.
  pgStatStatements: true
  storage:
    size: 10Gi
    storageClassName: ""
  database: marc
  owner: marcAdmin
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # -- postgresql.conf settings, sized for the 1Gi limit above. Postgres's own
  # defaults assume a 128 MB machine and size nothing for this workload. When
  # you raise the resources, raise these with them; the table below gives
  # values per catalogue size. Changing shared_buffers restarts the instance.
  #
  # jit is off because the live facet and preview queries are expensive
  # enough to trigger it but too short to repay it: compilation added
  # 0.3–0.6 s to queries that otherwise take 0.2–1 s.
  parameters:
    jit: "off"
    # ~25% of the memory limit. The analytics table the facets scan is
    # ~110 MB per 345k records.
    shared_buffers: 256MB
    # ~70% of the memory limit: shared_buffers plus what the kernel caches.
    effective_cache_size: 704MB
    # Per sort or hash, per query, so a busy instance holds several. The
    # record search's hash spilled to disk at the default 4MB.
    work_mem: 16MB
    maintenance_work_mem: 128MB
    # For SSD-backed volumes. The default 4.0 assumes spinning disks and
    # steers the planner away from index scans it should take; set it back
    # on rotational storage.
    random_page_cost: "1.1"
    # Parallel workers share the CPU limit with their leader, so at one
    # CPU they add overhead and CFS throttling.
    max_parallel_workers_per_gather: "0"
  #
  # Sizing by number of catalogue records. Measured at 345k records on k3d:
  # the core schema takes ~1.15 GB (catalog_records 285 MB, analytics
  # 176 MB, validations 92 MB, authority_links 72 MB), so ~3.3 GB per 1M
  # records. Of that, the tables the searches and facets read take about
  # 1.8 GB per 1M.
  #
  #   records   cpu req/lim  mem req/lim  shared_buffers  effective_cache_size  work_mem  maintenance_work_mem  parallel/gather  storage
  #   100k      250m / 1     512Mi / 1Gi  256MB           704MB                 16MB      128MB                 0                10Gi
  #   500k      500m / 2     1Gi / 2Gi    512MB           1408MB                16MB      256MB                 1                15Gi
  #   1M        1 / 2        2Gi / 4Gi    1GB             2816MB                32MB      512MB                 1                20Gi
  #   2M        2 / 4        4Gi / 8Gi    2GB             5632MB                32MB      1GB                   2                30Gi
  #   5M        4 / 8        8Gi / 16Gi   4GB             11GB                  64MB      2GB                   4                60Gi
  #   10M       4 / 8        16Gi / 32Gi  8GB             22GB                  64MB      2GB                   4                120Gi
  #
  # - Storage is ~3x the core schema, to leave room for WAL (up to
  #   max_wal_size, 1 GB by default), for dead rows between vacuums, and for
  #   the analytics rebuild. The rebuild truncates and refills the table in
  #   one transaction, so the old files stay on disk until it commits.
  # - Add ~15Gi for the plugins' local data copies if any are enabled. That
  #   size depends on the external sources, not the catalogue: at 9M
  #   national records the MARCXML dump is 10 GB and Kramerius 1.1 GB.
  # - Filtered facets scan the analytics table and grow with it: ~1 s per
  #   345k records on one core for a filter that matches half of them.
  #   Parallel workers divide that, so from 2M records give the database
  #   the CPUs to run them.
  # - Keep work_mem modest and add memory instead. The limit applies to each
  #   sort and hash in each query on each connection (hashes may use twice
  #   that, by hash_mem_multiplier), so many concurrent queries multiply it.
  # - For more than one instance, size each replica the same as the
  #   primary.

# -- Ollama (optional LLM for comparison)
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: "latest"
  port: 11434
  models: "qwen2.5vl:7b"
  storage:
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

# -- Shared application config
config:
  # PostgreSQL (should match cnpg settings)
  postgresHost: "marc-comparator-db-rw"
  postgresPort: "5432"
  postgresDb: "marc"
  postgresUser: "marcAdmin"

  # Broker (auto-configured to internal redis)
  brokerDb: "0"

  # Auth
  algorithm: "HS256"
  accessTokenExpireMinutes: "30"
  refreshTokenExpireDays: "7"
  cookieSecure: "true"
  cookieDomain: ""

  # Admin bootstrap user
  adminEmail: "admin@mzk.cz"
  adminFirstname: "Admin"
  adminLastname: "Admin"

  # General
  timezoneName: "Europe/Prague"
  logLevel: "info"

  # OIDC (optional) — oidcAppBaseUrl is the public-facing URL (e.g. https://example.com)
  # OIDC callback is at {oidcAppBaseUrl}/api/auth/oidc/callback
  oidcEnabled: "false"
  oidcDefault: "false"
  oidcIssuerUrl: ""
  oidcClientId: ""
  oidcAppBaseUrl: ""

# -- Secrets (override via --set or external secret)
secrets:
  postgresPassword: "replaceMe"
  secretKey: "replace-with-some-secret-of-length-at-least-32"
  adminPassword: "replaceMe"
  oidcClientSecret: ""

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
